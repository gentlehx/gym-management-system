<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="adminCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="adminCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="adminCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">添加器材</h1>

                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">数据看板</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/equipment/selEquipment}">器材台账</a></li>
                    <li class="breadcrumb-item active">添加器材</li>
                </ol>

                <div class="aside-tips">
                    <i class="fas fa-circle-info"></i>
                    <div>器材状态可选「正常 / 维修中 / 损坏」，状态非「正常」时会在看板与待办中心提示；后续维修可在「器材维修」中登记工单。</div>
                </div>

                <div class="card mb-4 form-card">
                    <div class="card-header"><i class="fas fa-dumbbell me-1"></i>器材基础信息</div>
                    <div class="card-body">
                        <form th:action="@{/equipment/addEquipment}" method="post" name="addForm"
                              onsubmit="return beforeSubmit(this)">
                            <div class="form-grid">
                                <div class="field">
                                    <label>器材名称<span class="req">*</span></label>
                                    <input type="text" class="form-control" placeholder="如 跑步机4" name="equipmentName">
                                </div>
                                <div class="field">
                                    <label>存放位置<span class="req">*</span></label>
                                    <input type="text" class="form-control" placeholder="如 2号房间" name="equipmentLocation">
                                </div>
                                <div class="field">
                                    <label>器材状态<span class="req">*</span></label>
                                    <select class="form-select" name="equipmentStatus">
                                        <option value="正常">正常</option>
                                        <option value="维修中">维修中</option>
                                        <option value="损坏">损坏</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label>备注信息</label>
                                    <input type="text" class="form-control" placeholder="如 待维修 / 联系厂家" name="equipmentMessage">
                                    <div class="hint">可留空</div>
                                </div>
                            </div>

                            <div class="form-actions">
                                <a class="btn btn-outline-secondary" th:href="@{/equipment/selEquipment}">取消</a>
                                <input type="submit" class="btn btn-primary" value="保存器材">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="adminCommon::common-footer"></footer>
    </div>
</div>

<div th:include="adminCommon::common-scripts"></div>
<script type="text/javascript">
    function beforeSubmit(addForm) {
        if (addForm.equipmentName.value == "") {
            alert("请输入器材名称！");
            return false;
        }
        if (addForm.equipmentLocation.value == "") {
            alert("请输入器材位置！");
            return false;
        }
        if (addForm.equipmentStatus.value == "") {
            alert("请输入器材状态！");
            return false;
        }
        return true;
    }
</script>
</body>
</html>
