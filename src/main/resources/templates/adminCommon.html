<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="common-header">

    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content="gym-management-system"/>
    <meta name="author" content="MiloTnT"/>
    <title>健身房管理系统-管理员</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet"/>
    <link href="/static/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link href="/static/css/app.css" th:href="@{/css/app.css}" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"
            crossorigin="anonymous"></script>

</head>
<body>

<!--导航栏-->
<nav class="sb-topnav navbar navbar-expand navbar-light bg-white" th:fragment="common-navbar">
    <a class="navbar-brand" th:href="@{/admin/dashboard}">
        <span class="brand-mark"><i class="fas fa-dumbbell"></i></span>
        <span>健身房管理系统<small>GYM OPERATIONS</small></span>
    </a>

    <button class="btn btn-link btn-sm me-2" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>

    <form class="topbar-search d-none d-md-block" th:action="@{/member/selMember}" method="get">
        <div class="input-group">
            <span class="input-group-text bg-transparent border-0 pe-0"><i
                    class="fas fa-search text-muted small"></i></span>
            <input class="form-control" type="text" name="keyword"
                   placeholder="搜索会员姓名 / 卡号 / 手机号" aria-label="搜索">
        </div>
    </form>

    <div class="topbar-actions">
        <a class="icon-btn" th:href="@{/todo}" title="待办中心"><i class="far fa-bell"></i><span class="dot"></span></a>
        <a class="icon-btn" th:href="@{/report/selReport}" title="报表中心"><i class="fas fa-chart-pie"></i></a>

        <div class="dropdown">
            <a class="user-chip dropdown-toggle text-decoration-none" href="#" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
                <span class="avatar">管</span>
                <span class="who"><b>管理员</b><span>超级管理员</span></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><a class="dropdown-item" th:href="@{/admin/dashboard}"><i class="fas fa-tachometer-alt fa-fw"></i>&nbsp;数据看板</a>
                </li>
                <li><a class="dropdown-item" th:href="@{/todo}"><i class="far fa-bell fa-fw"></i>&nbsp;待办中心</a></li>
                <li><a class="dropdown-item" th:href="@{/report/selReport}"><i class="fas fa-chart-pie fa-fw"></i>&nbsp;报表中心</a>
                </li>
                <li><a class="dropdown-item" th:href="@{/log/selLog}"><i class="fas fa-history fa-fw"></i>&nbsp;操作日志</a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item text-danger" th:href="@{/}"><i class="fas fa-sign-out-alt fa-fw"></i>&nbsp;退出登录</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!--侧边栏-->
<div id="layoutSidenav_nav" th:fragment="common-sidenav">
    <nav class="sb-sidenav accordion sb-sidenav-light" id="sidenavAccordion">
        <div class="sb-sidenav-menu">
            <div class="nav">

                <div class="sb-sidenav-menu-heading">概览</div>
                <a class="nav-link" th:href="@{/admin/dashboard}">
                    <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                    数据看板
                </a>
                <a class="nav-link" th:href="@{/todo}">
                    <div class="sb-nav-link-icon"><i class="far fa-bell"></i></div>
                    待办中心
                </a>
                <a class="nav-link" th:href="@{/report/selReport}">
                    <div class="sb-nav-link-icon"><i class="fas fa-chart-line"></i></div>
                    报表中心
                </a>

                <div class="sb-sidenav-menu-heading">会员</div>
                <a class="nav-link" th:href="@{/member/selMember}">
                    <div class="sb-nav-link-icon"><i class="fas fa-user"></i></div>
                    会员管理
                </a>
                <a class="nav-link" th:href="@{/member/toSelByCard}">
                    <div class="sb-nav-link-icon"><i class="fas fa-id-card"></i></div>
                    会员卡查询
                </a>
                <a class="nav-link" th:href="@{/bodytest/selBodyTest}">
                    <div class="sb-nav-link-icon"><i class="fas fa-heartbeat"></i></div>
                    体测记录
                </a>

                <div class="sb-sidenav-menu-heading">运营</div>
                <a class="nav-link" th:href="@{/class/selClass}">
                    <div class="sb-nav-link-icon"><i class="fas fa-calendar-alt"></i></div>
                    课程管理
                </a>
                <a class="nav-link" th:href="@{/checkin/selCheckin}">
                    <div class="sb-nav-link-icon"><i class="fas fa-door-open"></i></div>
                    签到管理
                </a>
                <a class="nav-link" th:href="@{/payment/selPayment}">
                    <div class="sb-nav-link-icon"><i class="fas fa-coins"></i></div>
                    收费管理
                </a>
                <a class="nav-link" th:href="@{/maintain/selMaintain}">
                    <div class="sb-nav-link-icon"><i class="fas fa-tools"></i></div>
                    器材维修
                </a>
                <a class="nav-link" th:href="@{/notice/selNotice}">
                    <div class="sb-nav-link-icon"><i class="fas fa-bullhorn"></i></div>
                    公告管理
                </a>

                <div class="sb-sidenav-menu-heading">组织与系统</div>
                <a class="nav-link" th:href="@{/employee/selEmployee}">
                    <div class="sb-nav-link-icon"><i class="fas fa-user-tie"></i></div>
                    员工管理
                </a>
                <a class="nav-link" th:href="@{/equipment/selEquipment}">
                    <div class="sb-nav-link-icon"><i class="fas fa-table-tennis"></i></div>
                    器材台账
                </a>
                <a class="nav-link" th:href="@{/log/selLog}">
                    <div class="sb-nav-link-icon"><i class="fas fa-history"></i></div>
                    操作日志
                </a>
            </div>
        </div>

        <div class="sb-sidenav-footer">
            <div class="small">当前登录</div>
            管理员 · 1001
        </div>
    </nav>
</div>

<!--页脚-->
<footer class="py-4 bg-light mt-auto" th:fragment="common-footer">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between small">
            <div class="text-muted">健身房运营管理系统 · GymPro</div>
            <div class="text-muted">数据截至 2025-10-10</div>
        </div>
    </div>
</footer>

<div th:fragment="common-scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
    <script src="/static/js/scripts.js" th:src="@{/js/scripts.js}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
    <script src="/static/js/datatables-simple-demo.js" th:src="@{/js/datatables-simple-demo.js}"></script>
    <script src="/static/js/app.js" th:src="@{/js/app.js}"></script>
</div>

</body>
</html>
