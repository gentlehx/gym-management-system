<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="adminCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="adminCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="adminCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">器材台账</h1>

                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">数据看板</a></li>
                    <li class="breadcrumb-item active">器材台账</li>
                </ol>

                <div class="row g-3 mb-4">
                    <div class="col-xl-3 col-md-6">
                        <div class="stat">
                            <div class="stat-top">
                                <span class="stat-label">器材总数</span>
                                <span class="stat-icon"><i class="fas fa-dumbbell"></i></span>
                            </div>
                            <div class="stat-value num" th:text="${#lists.size(equipmentList)}">0</div>
                            <div class="stat-foot"><i class="fas fa-warehouse"></i> 全场馆在册器材</div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="stat green">
                            <div class="stat-top">
                                <span class="stat-label">正常可用</span>
                                <span class="stat-icon"><i class="fas fa-circle-check"></i></span>
                            </div>
                            <div class="stat-value num"
                                 th:text="${#lists.size(equipmentList.?[equipmentStatus == '正常'])}">0</div>
                            <div class="stat-foot"><i class="fas fa-check"></i> 可正常投入使用</div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="stat amber">
                            <div class="stat-top">
                                <span class="stat-label">维修中</span>
                                <span class="stat-icon"><i class="fas fa-screwdriver-wrench"></i></span>
                            </div>
                            <div class="stat-value num"
                                 th:text="${#lists.size(equipmentList.?[equipmentStatus == '维修中'])}">0</div>
                            <div class="stat-foot"><i class="fas fa-clock"></i> 正在处理中</div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="stat rose">
                            <div class="stat-top">
                                <span class="stat-label">损坏待修</span>
                                <span class="stat-icon"><i class="fas fa-triangle-exclamation"></i></span>
                            </div>
                            <div class="stat-value num"
                                 th:text="${#lists.size(equipmentList.?[equipmentStatus == '损坏'])}">0</div>
                            <div class="stat-foot"><i class="fas fa-arrow-right"></i> 建议尽快报修</div>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-table me-1"></i>器材信息表（<span th:text="${#lists.size(equipmentList)}">0</span> 件）</span>
                        <div class="d-flex gap-2">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/maintain/selMaintain}">
                                <i class="fas fa-screwdriver-wrench me-1"></i>维修工单
                            </a>
                            <a class="btn btn-sm btn-primary" th:href="@{/equipment/toAddEquipment}">
                                <i class="fas fa-plus me-1"></i>新增器材
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <table id="datatablesSimple">
                            <thead>
                            <tr>
                                <th>器材ID</th>
                                <th>名称</th>
                                <th>位置</th>
                                <th>状态</th>
                                <th>备注信息</th>
                                <th>操作</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="equ:${equipmentList}">
                                <td th:text="${equ.equipmentId}">id</td>
                                <td style="font-weight:600" th:text="${equ.equipmentName}">name</td>
                                <td th:text="${equ.equipmentLocation}">location</td>
                                <td>
                                    <span class="badge bg-success"
                                          th:if="${equ.equipmentStatus == '正常'}">正常</span>
                                    <span class="badge bg-warning"
                                          th:if="${equ.equipmentStatus == '维修中'}">维修中</span>
                                    <span class="badge bg-danger"
                                          th:if="${equ.equipmentStatus == '损坏'}">损坏</span>
                                    <span class="badge bg-light text-dark"
                                          th:if="${equ.equipmentStatus != '正常'
                                                   && equ.equipmentStatus != '维修中'
                                                   && equ.equipmentStatus != '损坏'}"
                                          th:text="${equ.equipmentStatus}">状态</span>
                                </td>
                                <td th:text="${equ.equipmentMessage}">message</td>
                                <td style="white-space:nowrap">
                                    <a class="btn btn-sm btn-outline-primary"
                                       th:href="@{/equipment/toUpdateEquipment(equipmentId=${equ.equipmentId})}">编辑</a>
                                    <a class="btn btn-sm btn-outline-danger"
                                       th:href="@{/equipment/delEquipment(equipmentId=${equ.equipmentId})}"
                                       onclick="return del()">删除</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="adminCommon::common-footer"></footer>
    </div>
</div>

<div th:include="adminCommon::common-scripts"></div>
<script>
    function del() {
        let msg = "确定要删除该器材吗？";
        if (confirm(msg) == true) {
            return true;
        } else {
            return false;
        }
    }
</script>
</body>
</html>
