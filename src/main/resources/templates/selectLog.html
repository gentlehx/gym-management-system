<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="adminCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="adminCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="adminCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">操作日志</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toAdminMain}">主页</a></li>
                    <li class="breadcrumb-item active">操作日志</li>
                </ol>

                <div class="alert alert-success alert-dismissible fade show" th:if="${msg}">
                    <i class="fas fa-check-circle me-1"></i><span th:text="${msg}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-history me-1"></i>最近操作（累计 <span th:text="${logTotal}">0</span> 条）</span>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/log/clearLog}"
                           onclick="return confirm('确定清空全部操作日志吗？此操作不可恢复。')">
                            <i class="fas fa-trash-alt me-1"></i>清空日志
                        </a>
                    </div>
                    <div class="card-body">
                        <form class="row g-2 mb-3" th:action="@{/log/selLog}" method="get">
                            <div class="col-auto">
                                <input type="text" class="form-control" name="keyword" th:value="${keyword}"
                                       placeholder="操作人 / 动作 / 参数关键字">
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-primary" type="submit"><i class="fas fa-search me-1"></i>筛选</button>
                            </div>
                            <div class="col-auto" th:if="${keyword != ''}">
                                <a class="btn btn-outline-secondary" th:href="@{/log/selLog}">清空条件</a>
                            </div>
                        </form>

                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>操作时间</th>
                                <th>操作人</th>
                                <th>角色</th>
                                <th>动作</th>
                                <th>参数</th>
                                <th>来源 IP</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="l:${logList}">
                                <td class="small" th:text="${l.createdAt}">2025-10-10 19:20:33</td>
                                <td th:text="${l.operator}">管理员1001</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${l.role == '管理员'} ? 'bg-primary' : 'bg-light text-dark'"
                                          th:text="${l.role}">管理员</span>
                                </td>
                                <td th:text="${l.action}">新增收费</td>
                                <td class="small text-muted" th:text="${l.detail}"></td>
                                <td class="small text-muted" th:text="${l.ip}">127.0.0.1</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(logList)}">
                                <td colspan="6">
                                    <div class="empty"><i class="far fa-folder-open"></i>
                                        <p>还没有操作记录，做一次新增或修改就会出现在这里</p></div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="adminCommon::common-footer"></footer>
    </div>
</div>

<div th:include="adminCommon::common-scripts"></div>
</body>
</html>
