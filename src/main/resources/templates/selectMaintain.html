<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="adminCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="adminCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="adminCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">器材维修</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toAdminMain}">主页</a></li>
                    <li class="breadcrumb-item active">器材维修</li>
                </ol>

                <div class="alert alert-success alert-dismissible fade show" th:if="${msg}">
                    <i class="fas fa-check-circle me-1"></i><span th:text="${msg}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="row">
                    <div class="col-xl-4 col-md-6">
                        <div class="card bg-danger text-white mb-4">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="small">待处理维修单</div>
                                    <div class="fs-4 fw-bold" th:text="${pendingCount} + ' 单'">5 单</div>
                                </div>
                                <i class="fas fa-tools fa-2x opacity-50"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-4 col-md-6">
                        <div class="card bg-warning text-white mb-4">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="small">维修费用合计</div>
                                    <div class="fs-4 fw-bold">
                                        ¥<span th:text="${#numbers.formatDecimal(totalCost,1,'COMMA',2,'POINT')}">1,870.00</span>
                                    </div>
                                </div>
                                <i class="fas fa-yen-sign fa-2x opacity-50"></i>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-4 col-md-6">
                        <div class="card bg-primary text-white mb-4">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="small">在场器材</div>
                                    <div class="fs-4 fw-bold" th:text="${#lists.size(equipmentList)} + ' 件'">7 件</div>
                                </div>
                                <i class="fas fa-dumbbell fa-2x opacity-50"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-table me-1"></i>维修记录</span>
                        <button type="button" class="btn btn-sm btn-primary" data-bs-toggle="modal"
                                data-bs-target="#addMaintainModal">
                            <i class="fas fa-plus me-1"></i>登记报修
                        </button>
                    </div>
                    <div class="card-body">
                        <table id="datatablesSimple">
                            <thead>
                            <tr>
                                <th>单号</th>
                                <th>器材</th>
                                <th>故障描述</th>
                                <th>处理人</th>
                                <th>报修日期</th>
                                <th>费用(元)</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="r:${maintainList}">
                                <td th:text="${r.maintainId}">1</td>
                                <td th:text="${r.equipmentName}">跑步机1</td>
                                <td th:text="${r.faultDesc}">跑带跑偏</td>
                                <td th:text="${r.handler}">教练2</td>
                                <td th:text="${r.maintainDate}">2025-10-05</td>
                                <td th:text="${#numbers.formatDecimal(r.cost,1,'COMMA',2,'POINT')}">680.00</td>
                                <td>
                                    <span class="badge bg-success" th:if="${r.status == '已完成'}">已完成</span>
                                    <span class="badge bg-warning text-dark" th:if="${r.status == '待维修'}">待维修</span>
                                    <span class="badge bg-info text-dark" th:if="${r.status == '维修中'}">维修中</span>
                                </td>
                                <td>
                                    <a th:if="${r.status != '已完成'}"
                                       th:href="@{/maintain/finishMaintain(maintainId=${r.maintainId},equipmentId=${r.equipmentId})}"
                                       class="btn btn-sm btn-outline-success">完成</a>
                                    <a th:href="@{/maintain/delMaintain(maintainId=${r.maintainId})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('确定删除这条维修记录吗？')">删除</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="adminCommon::common-footer"></footer>
    </div>
</div>

<!-- 登记报修弹窗 -->
<div class="modal fade" id="addMaintainModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/maintain/addMaintain}" method="post">
            <div class="modal-header">
                <h5 class="modal-title">登记报修</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">器材</label>
                    <select class="form-select" name="equipmentId" required>
                        <option value="">请选择器材</option>
                        <option th:each="e:${equipmentList}" th:value="${e.equipmentId}"
                                th:text="${e.equipmentName} + '（' + ${e.equipmentLocation} + '，当前' + ${e.equipmentStatus} + '）'"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">故障描述</label>
                    <input type="text" class="form-control" name="faultDesc" placeholder="如：跑带跑偏，电机异响" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">处理人</label>
                        <input type="text" class="form-control" name="handler" placeholder="如：教练2 / 厂家售后">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">预计费用（元）</label>
                        <input type="number" step="0.01" min="0" value="0" class="form-control" name="cost">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">状态</label>
                    <select class="form-select" name="status">
                        <option value="待维修">待维修</option>
                        <option value="维修中">维修中</option>
                    </select>
                </div>
                <div class="text-muted small">提交后该器材状态会自动置为“维修中”，报修日期记为 2025-10-10。</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary">提交</button>
            </div>
        </form>
    </div>
</div>

<div th:include="adminCommon::common-scripts"></div>
</body>
</html>
