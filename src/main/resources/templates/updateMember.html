<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="adminCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="adminCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="adminCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">编辑会员</h1>

                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/admin/dashboard}">数据看板</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/member/selMember}">会员管理</a></li>
                    <li class="breadcrumb-item active">编辑会员</li>
                </ol>

                <div class="card mb-4 form-card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-pen me-1"></i>修改会员信息</span>
                        <a class="btn btn-sm btn-outline-secondary"
                           th:each="mem:${memberList}"
                           th:href="@{/member/detail(memberAccount=${mem.memberAccount})}">
                            <i class="fas fa-folder-open me-1"></i>查看完整档案
                        </a>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/member/updateMember}" method="post" name="updateForm"
                              onsubmit="return beforeSubmit(this)">
                            <div th:each="mem:${memberList}">
                                <div class="form-grid">
                                    <div class="field">
                                        <label>会员账号 / 卡号</label>
                                        <input type="text" class="form-control" readonly="readonly"
                                               th:value="${mem.memberAccount}" name="memberAccount">
                                    </div>
                                    <div class="field">
                                        <label>登录密码</label>
                                        <input type="text" class="form-control" readonly="readonly"
                                               th:value="${mem.memberPassword}" name="memberPassword">
                                        <div class="hint">会员可自行在个人中心修改</div>
                                    </div>
                                    <div class="field">
                                        <label>姓名</label>
                                        <input type="text" class="form-control" th:value="${mem.memberName}"
                                               name="memberName">
                                    </div>
                                    <div class="field">
                                        <label>性别</label>
                                        <select class="form-select" name="memberGender">
                                            <option value="男" th:selected="${mem.memberGender == '男'}">男</option>
                                            <option value="女" th:selected="${mem.memberGender == '女'}">女</option>
                                        </select>
                                    </div>
                                    <div class="field">
                                        <label>年龄</label>
                                        <input type="number" min="10" max="99" class="form-control"
                                               th:value="${mem.memberAge}" name="memberAge">
                                    </div>
                                    <div class="field">
                                        <label>联系方式</label>
                                        <input type="text" class="form-control" th:value="${mem.memberPhone}"
                                               name="memberPhone">
                                    </div>
                                    <div class="field">
                                        <label>身高（cm）</label>
                                        <input type="text" class="form-control" th:value="${mem.memberHeight}"
                                               name="memberHeight" id="h">
                                    </div>
                                    <div class="field">
                                        <label>体重（kg）</label>
                                        <input type="text" class="form-control" th:value="${mem.memberWeight}"
                                               name="memberWeight" id="w">
                                    </div>
                                    <div class="field">
                                        <label>购买课时</label>
                                        <input type="number" min="0" class="form-control" th:value="${mem.cardClass}"
                                               name="cardClass">
                                    </div>
                                    <div class="field">
                                        <label>剩余课时</label>
                                        <input type="number" min="0" class="form-control" th:value="${mem.cardNextClass}"
                                               name="cardNextClass">
                                        <div class="hint">续费时在此增加课时即可</div>
                                    </div>
                                    <div class="field">
                                        <label>办卡时间</label>
                                        <input type="text" class="form-control" th:value="${mem.cardTime}" readonly>
                                    </div>
                                    <div class="field">
                                        <label>到期日</label>
                                        <input type="text" class="form-control" th:value="${mem.cardEndDate}" readonly>
                                        <div class="hint">到期日由办卡时间自动推算，如需调整请走续费流程</div>
                                    </div>
                                </div>

                                <div class="form-actions">
                                    <a class="btn btn-outline-secondary" th:href="@{/member/selMember}">取消</a>
                                    <input type="submit" class="btn btn-primary" value="确认修改">
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="adminCommon::common-footer"></footer>
    </div>
</div>

<div th:include="adminCommon::common-scripts"></div>
<script type="text/javascript">
    function beforeSubmit(updateForm) {
        let phone = /^[1][3,4,5,7,8,9][0-9]{9}$/;
        if (!phone.test(updateForm.memberPhone.value)) {
            alert("手机号码错误！");
            return false;
        }
        return true;
    }
</script>
</body>
</html>
