<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="userCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="userCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="userCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">编辑个人信息</h1>

                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/user/toUserMain}">我的主页</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/user/toUserInfo}">个人信息</a></li>
                    <li class="breadcrumb-item active">编辑</li>
                </ol>

                <div class="card mb-4 form-card">
                    <div class="card-header"><i class="fas fa-pen me-1"></i>修改我的资料</div>
                    <div class="card-body">
                        <form th:action="@{/user/updateInfo}" method="post" name="updateForm"
                              onsubmit="return beforeSubmit(this)">
                            <div class="form-grid">
                                <div class="field">
                                    <label>会员账号 / 卡号</label>
                                    <input type="text" class="form-control" readonly="readonly"
                                           th:value="${member.memberAccount}" name="memberAccount">
                                    <div class="hint">卡号不可自行修改</div>
                                </div>
                                <div class="field">
                                    <label>登录密码</label>
                                    <input type="text" class="form-control" th:value="${member.memberPassword}"
                                           name="memberPassword">
                                    <div class="hint">请牢记密码，下次登录需使用</div>
                                </div>
                                <div class="field">
                                    <label>姓名</label>
                                    <input type="text" class="form-control" th:value="${member.memberName}"
                                           name="memberName">
                                </div>
                                <div class="field">
                                    <label>性别</label>
                                    <select class="form-select" name="memberGender">
                                        <option value="男" th:selected="${member.memberGender == '男'}">男</option>
                                        <option value="女" th:selected="${member.memberGender == '女'}">女</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label>年龄</label>
                                    <input type="number" min="10" max="99" class="form-control"
                                           th:value="${member.memberAge}" name="memberAge">
                                </div>
                                <div class="field">
                                    <label>联系方式</label>
                                    <input type="text" class="form-control" th:value="${member.memberPhone}"
                                           name="memberPhone">
                                </div>
                                <div class="field">
                                    <label>身高（cm）</label>
                                    <input type="text" class="form-control" th:value="${member.memberHeight}"
                                           name="memberHeight">
                                </div>
                                <div class="field">
                                    <label>体重（kg）</label>
                                    <input type="text" class="form-control" th:value="${member.memberWeight}"
                                           name="memberWeight">
                                </div>
                            </div>

                            <div class="form-actions">
                                <a class="btn btn-outline-secondary" th:href="@{/user/toUserInfo}">取消</a>
                                <input type="submit" class="btn btn-primary" value="保存修改">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="userCommon::common-footer"></footer>
    </div>
</div>

<div th:include="userCommon::common-scripts"></div>
<script type="text/javascript">
    function beforeSubmit(updateForm) {
        let phone = /^[1][3,4,5,7,8,9][0-9]{9}$/;
        if (!phone.test(updateForm.memberPhone.value)) {
            alert("手机号码错误！");
            return false;
        }
        return true;
    }
</script>
</body>
</html>
