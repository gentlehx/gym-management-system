<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="userCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="userCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="userCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">体测记录</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toUserMain}">主页</a></li>
                    <li class="breadcrumb-item active">体测记录</li>
                </ol>

                <div class="alert alert-success alert-dismissible fade show" th:if="${msg}">
                    <i class="fas fa-check-circle me-1"></i><span th:text="${msg}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="row">
                    <div class="col-xl-3 col-md-6">
                        <div class="card bg-primary text-white mb-4">
                            <div class="card-body">
                                <div class="small">最新体重</div>
                                <div class="fs-3 fw-bold">
                                    <span th:text="${latest != null} ? ${latest.weight} : '--'">60.2</span> kg
                                </div>
                            </div>
                            <div class="card-footer small"
                                 th:if="${latest != null and first != null and latest != first}"
                                 th:text="'首次 ' + ${first.weight} + ' kg'"></div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card bg-success text-white mb-4">
                            <div class="card-body">
                                <div class="small">最新体脂率</div>
                                <div class="fs-3 fw-bold">
                                    <span th:text="${latest != null} ? ${latest.bodyFat} : '--'">19.2</span> %
                                </div>
                            </div>
                            <div class="card-footer small" th:text="'身高 ' + ${member.memberHeight} + ' cm'"></div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card bg-warning text-white mb-4">
                            <div class="card-body">
                                <div class="small">最新 BMI</div>
                                <div class="fs-3 fw-bold" th:text="${latest != null} ? ${latest.bmi} : '--'">18.2</div>
                            </div>
                            <div class="card-footer small">18.5 ~ 23.9 为正常范围</div>
                        </div>
                    </div>
                    <div class="col-xl-3 col-md-6">
                        <div class="card bg-danger text-white mb-4">
                            <div class="card-body">
                                <div class="small">体测次数</div>
                                <div class="fs-3 fw-bold" th:text="${#lists.size(bodyTestList)} + ' 次'">3 次</div>
                            </div>
                            <div class="card-footer small">
                                <a class="text-white" href="#" data-bs-toggle="modal" data-bs-target="#addBodyTestModal">
                                    + 记录一次体测
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-xl-7">
                        <div class="card mb-4">
                            <div class="card-header"><i class="fas fa-chart-line me-1"></i>体重 / 体脂变化</div>
                            <div class="card-body" style="height: 300px">
                                <canvas id="bodyChart"></canvas>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-5">
                        <div class="card mb-4">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <span><i class="fas fa-history me-1"></i>历史记录</span>
                                <button class="btn btn-sm btn-primary" data-bs-toggle="modal"
                                        data-bs-target="#addBodyTestModal">新增
                                </button>
                            </div>
                            <div class="card-body p-0" style="max-height: 300px; overflow-y: auto">
                                <table class="table table-sm mb-0">
                                    <thead>
                                    <tr>
                                        <th>日期</th>
                                        <th>体重</th>
                                        <th>体脂</th>
                                        <th>肌肉</th>
                                        <th>BMI</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:each="b:${bodyTestList}">
                                        <td th:text="${b.testDate}">2025-10-08</td>
                                        <td th:text="${b.weight}">60.2</td>
                                        <td th:text="${b.bodyFat}">19.2</td>
                                        <td th:text="${b.muscle}">23.7</td>
                                        <td th:text="${b.bmi}">18.2</td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(bodyTestList)}">
                                        <td colspan="5" class="text-center text-muted py-4">还没有体测记录</td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="userCommon::common-footer"></footer>
    </div>
</div>

<!-- 新增体测 -->
<div class="modal fade" id="addBodyTestModal" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" th:action="@{/user/addBodyTest}" method="post">
            <div class="modal-header">
                <h5 class="modal-title">记录体测数据</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">体重（kg）</label>
                    <input type="number" step="0.1" min="0" class="form-control" name="weight" required>
                </div>
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label">体脂率（%）</label>
                        <input type="number" step="0.1" min="0" max="60" class="form-control" name="bodyFat">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label">肌肉量（kg）</label>
                        <input type="number" step="0.1" min="0" class="form-control" name="muscle">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">教练点评</label>
                    <input type="text" class="form-control" name="remark" placeholder="选填">
                </div>
                <div class="text-muted small">
                    身高 <span th:text="${member.memberHeight}">170</span> cm 取自个人资料，BMI 自动计算；
                    体测日期记为 2025-10-10。
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                <button type="submit" class="btn btn-primary">保存</button>
            </div>
        </form>
    </div>
</div>

<div th:include="userCommon::common-scripts"></div>
<div id="bodyData" th:text="${bodyTestJson}" style="display:none"></div>

<script>
    (function () {
        var el = document.getElementById('bodyData');
        var data = [];
        try {
            data = JSON.parse(el.textContent || '[]');
        } catch (e) {
            data = [];
        }
        var canvas = document.getElementById('bodyChart');
        if (!canvas) return;

        new Chart(canvas, {
            type: 'line',
            data: {
                labels: data.map(function (x) { return x.testDate; }),
                datasets: [
                    {
                        label: '体重(kg)',
                        data: data.map(function (x) { return x.weight; }),
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13,110,253,0.08)',
                        fill: true,
                        lineTension: 0.3
                    },
                    {
                        label: '体脂率(%)',
                        data: data.map(function (x) { return x.bodyFat; }),
                        borderColor: '#dc3545',
                        backgroundColor: 'rgba(220,53,69,0.05)',
                        yAxisID: 'y2',
                        lineTension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                legend: {position: 'bottom', labels: {boxWidth: 10, fontSize: 11}},
                scales: {
                    yAxes: [
                        {ticks: {beginAtZero: false}, scaleLabel: {display: true, labelString: 'kg'}},
                        {id: 'y2', position: 'right', gridLines: {display: false},
                         ticks: {beginAtZero: false}, scaleLabel: {display: true, labelString: '%'}}
                    ],
                    xAxes: [{gridLines: {display: false}}]
                }
            }
        });
    })();
</script>
</body>
</html>
