<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="common-header">

    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content="gym-management-system"/>
    <meta name="author" content="MiloTnT"/>
    <title>健身房管理系统-会员中心</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet"/>
    <link href="/static/css/styles.css" th:href="@{/css/styles.css}" rel="stylesheet"/>
    <link href="/static/css/app.css" th:href="@{/css/app.css}" rel="stylesheet"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js"
            crossorigin="anonymous"></script>

</head>
<body>

<!--导航栏-->
<nav class="sb-topnav navbar navbar-expand navbar-light bg-white" th:fragment="common-navbar">
    <a class="navbar-brand" th:href="@{/user/toUserMain}">
        <span class="brand-mark"><i class="fas fa-dumbbell"></i></span>
        <span>健身房会员中心<small>MEMBER CENTER</small></span>
    </a>

    <button class="btn btn-link btn-sm me-2" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>

    <div class="topbar-actions">
        <a class="icon-btn" th:href="@{/user/toNotice}" title="场馆公告"><i class="far fa-bell"></i></a>
        <a class="btn btn-primary btn-sm me-2 d-none d-md-inline-block" th:href="@{/user/toCheckIn}">
            <i class="fas fa-fingerprint me-1"></i>签到
        </a>

        <div class="dropdown">
            <a class="user-chip dropdown-toggle text-decoration-none" href="#" role="button"
               data-bs-toggle="dropdown" aria-expanded="false">
                <span class="avatar" th:text="${#strings.substring(#strings.isEmpty(session.user?.memberName) ? 'M' : session.user.memberName, 0, 1)}">张</span>
                <span class="who">
                    <b th:text="${session.user != null} ? ${session.user.memberName} : '会员'">会员</b>
                    <span th:text="${session.user != null} ? ${session.user.memberAccount} : ''">202509867</span>
                </span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                <li><a class="dropdown-item" th:href="@{/user/toUserMain}"><i class="fas fa-home fa-fw"></i>&nbsp;我的主页</a>
                </li>
                <li><a class="dropdown-item" th:href="@{/user/toUserInfo}"><i class="fas fa-user fa-fw"></i>&nbsp;个人信息</a></li>
                <li><a class="dropdown-item" th:href="@{/user/toMyPayment}"><i class="fas fa-receipt fa-fw"></i>&nbsp;我的消费</a>
                </li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item text-danger" th:href="@{/toUserLogin}"><i
                        class="fas fa-sign-out-alt fa-fw"></i>&nbsp;退出登录</a></li>
            </ul>
        </div>
    </div>
</nav>

<!--侧边栏-->
<div id="layoutSidenav_nav" th:fragment="common-sidenav">
    <nav class="sb-sidenav accordion sb-sidenav-light" id="sidenavAccordion">
        <div class="sb-sidenav-menu">
            <div class="nav">

                <div class="sb-sidenav-menu-heading">我的</div>
                <a class="nav-link" th:href="@{/user/toUserMain}">
                    <div class="sb-nav-link-icon"><i class="fas fa-home"></i></div>
                    我的主页
                </a>
                <a class="nav-link" th:href="@{/user/toUserInfo}">
                    <div class="sb-nav-link-icon"><i class="fas fa-user"></i></div>
                    个人信息
                </a>
                <a class="nav-link" th:href="@{/user/toCheckIn}">
                    <div class="sb-nav-link-icon"><i class="fas fa-door-open"></i></div>
                    签到打卡
                </a>
                <a class="nav-link" th:href="@{/user/toMyPayment}">
                    <div class="sb-nav-link-icon"><i class="fas fa-receipt"></i></div>
                    我的消费
                </a>
                <a class="nav-link" th:href="@{/user/toBodyTest}">
                    <div class="sb-nav-link-icon"><i class="fas fa-heartbeat"></i></div>
                    体测记录
                </a>

                <div class="sb-sidenav-menu-heading">课程</div>
                <a class="nav-link" th:href="@{/user/toApplyClass}">
                    <div class="sb-nav-link-icon"><i class="fas fa-calendar-plus"></i></div>
                    报名选课
                </a>
                <a class="nav-link" th:href="@{/user/toUserClass}">
                    <div class="sb-nav-link-icon"><i class="fas fa-list"></i></div>
                    我的课程
                </a>

                <div class="sb-sidenav-menu-heading">场馆</div>
                <a class="nav-link" th:href="@{/user/toNotice}">
                    <div class="sb-nav-link-icon"><i class="fas fa-bullhorn"></i></div>
                    场馆公告
                </a>
            </div>
        </div>

        <div class="sb-sidenav-footer">
            <div class="small">当前会员</div>
            <span th:text="${session.user != null} ? ${session.user.memberName} : '尊敬的会员'">会员</span>
        </div>
    </nav>
</div>

<!--页脚-->
<footer class="py-4 bg-light mt-auto" th:fragment="common-footer">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center justify-content-between small">
            <div class="text-muted">健身房会员中心 · GymPro</div>
            <div class="text-muted">营业时间 06:30 - 22:30</div>
        </div>
    </div>
</footer>

<div th:fragment="common-scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
    <script src="/static/js/scripts.js" th:src="@{/js/scripts.js}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
    <script src="/static/js/datatables-simple-demo.js" th:src="@{/js/datatables-simple-demo.js}"></script>
    <script src="/static/js/app.js" th:src="@{/js/app.js}"></script>
</div>

</body>
</html>
