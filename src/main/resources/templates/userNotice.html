<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="userCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="userCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="userCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">场馆公告</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toUserMain}">主页</a></li>
                    <li class="breadcrumb-item active">场馆公告</li>
                </ol>

                <div class="card mb-4">
                    <div class="card-body">
                        <div class="list-group">
                            <div class="list-group-item" th:each="n:${noticeList}">
                                <div class="d-flex w-100 justify-content-between align-items-start">
                                    <h6 class="mb-1">
                                        <span class="badge bg-danger me-1" th:if="${n.isTop == 1}">置顶</span>
                                        <span th:text="${n.title}">公告标题</span>
                                    </h6>
                                    <small class="text-muted text-nowrap ms-3" th:text="${n.publishTime}">2025-10-08</small>
                                </div>
                                <p class="mb-1 small text-muted" th:text="${n.content}">内容</p>
                                <small class="text-muted" th:text="'发布人：' + ${n.author}">发布人</small>
                            </div>
                            <div class="text-center text-muted py-5" th:if="${#lists.isEmpty(noticeList)}">暂无公告</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="userCommon::common-footer"></footer>
    </div>
</div>

<div th:include="userCommon::common-scripts"></div>
</body>
</html>
