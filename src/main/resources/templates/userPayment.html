<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="userCommon::common-header"></head>
<body class="sb-nav-fixed">
<nav th:replace="userCommon::common-navbar"></nav>
<div id="layoutSidenav">
    <div th:replace="userCommon::common-sidenav"></div>

    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <h1 class="mt-4">我的消费</h1>
                <ol class="breadcrumb mb-4">
                    <li class="breadcrumb-item"><a th:href="@{/toUserMain}">主页</a></li>
                    <li class="breadcrumb-item active">我的消费</li>
                </ol>

                <div class="card bg-success text-white mb-4">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <div class="small">累计消费</div>
                            <div class="fs-3 fw-bold">
                                ¥<span th:text="${#numbers.formatDecimal(myPayTotal,1,'COMMA',2,'POINT')}">1,980.00</span>
                            </div>
                        </div>
                        <i class="fas fa-wallet fa-3x opacity-50"></i>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header"><i class="fas fa-receipt me-1"></i>消费明细</div>
                    <div class="card-body">
                        <table class="table table-hover">
                            <thead>
                            <tr>
                                <th>日期</th>
                                <th>类型</th>
                                <th>支付方式</th>
                                <th>金额(元)</th>
                                <th>课时</th>
                                <th>备注</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="p:${paymentList}">
                                <td th:text="${p.payTime}">2025-10-08</td>
                                <td><span class="badge bg-light text-dark" th:text="${p.payType}">办卡</span></td>
                                <td th:text="${p.payWay}">微信</td>
                                <td class="fw-bold"
                                    th:text="'¥' + ${#numbers.formatDecimal(p.amount,1,'COMMA',2,'POINT')}">¥1980.00
                                </td>
                                <td th:text="${p.classCount}">30</td>
                                <td class="small text-muted" th:text="${p.remark}"></td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(paymentList)}">
                                <td colspan="6" class="text-center text-muted py-4">暂无消费记录</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <footer th:replace="userCommon::common-footer"></footer>
    </div>
</div>

<div th:include="userCommon::common-scripts"></div>
</body>
</html>
